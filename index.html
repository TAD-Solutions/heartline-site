<style>
  :root{--navy:#1A306F;--pink:#F07BA8;--draw:2.6s;--lag:.12s;--len:6000}
  html,body{height:100%}
  body{margin:0;background:#fff;color:var(--navy);font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
  main{display:flex;flex-direction:column;align-items:center;gap:clamp(20px,4vh,40px);padding:24px}
  svg{width:min(72vw,560px);height:auto;display:block;overflow:visible}
  .stroke{fill:none;stroke-width:14;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw var(--draw) cubic-bezier(.5,.05,.35,1) forwards}
  .stroke.pink{stroke:var(--pink);animation-delay:var(--lag)}
  .stroke.navy{stroke:var(--navy)}
  .tail{opacity:0;transform:scale(.15);transform-box:view-box;transform-origin:730px 660px;animation:tail .35s cubic-bezier(.2,.8,.3,1.2) forwards;animation-delay:calc(var(--draw) - .1s)}
  .tail.pink{fill:var(--pink);transform-origin:737px 665px;animation-delay:calc(var(--draw) - .1s + var(--lag))}
  .tail.navy{fill:var(--navy)}
  .dot{opacity:0;transform:scale(0);transform-box:fill-box;transform-origin:center;animation:dot .3s cubic-bezier(.2,.8,.3,1.4) forwards;animation-delay:calc(var(--draw) + .35s)}
  .dot.pink{fill:var(--pink);animation-delay:calc(var(--draw) + .35s + var(--lag))}
  .dot.navy{fill:var(--navy)}
  .caps{fill:var(--navy);opacity:0;transform:translateY(6px);transform-box:view-box;animation:rise .8s ease-out forwards;animation-delay:calc(var(--draw) + .85s)}
  .soon{margin:0;font-weight:500;font-size:clamp(13px,1.6vw,17px);letter-spacing:.32em;text-transform:uppercase;opacity:0;transform:translateY(6px);animation:rise .8s ease-out forwards;animation-delay:calc(var(--draw) + 1.75s)}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes tail{to{opacity:1;transform:scale(1)}}
  @keyframes dot{to{opacity:1;transform:scale(1)}}
  @keyframes rise{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.stroke,.tail,.dot,.caps,.soon{animation:none;opacity:1;transform:none;stroke-dashoffset:0}}
</style>
